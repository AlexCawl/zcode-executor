# 推 main 或开 PR → 跑测试。CLI 本身零依赖；dsh-plugin 的构建产物 lib/ 不入库，先装 pnpm 构建它
# （test/dsh-manifest.test.mjs 会读构建出的 client.js）。Node 22 是 engines 的下限，24 是当前 LTS。
# windows-latest 那一档探过路就关掉了：测试本身跑得通（297 过 6 跳过），但运行时还没适配
# （SIGTERM 收不到、kill(-pid) 杀不了进程组、找不到 App 的位置），不支持的平台没必要天天跑。
# 认领 Windows 时把下面那行注释打开，待办清单在 docs/verified.md 的「跨平台」一节。
# test:ci 里的 glob 不能加引号：Windows 的 shell 不剥单引号，node 收到带引号的字面串，
# 一个文件都匹配不到——而 node --test 匹配不到文件时退 0，于是整档假绿（实测 2026-09-08）。
# test:ci 把测试文件串行跑：runner 和 mock 都是真子进程，4 核 runner 上并行会把时序挤乱。
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # 一边红了另一边照跑完，才看得出是平台问题还是版本问题
      matrix:
        os: [ubuntu-latest] # , windows-latest —— 见文件头的说明
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # dsh-plugin/lib 不入库：测试前构建，版本钉在 dsh-plugin 的 packageManager
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - run: pnpm install --frozen-lockfile
        working-directory: dsh-plugin
      - run: npm run build
        working-directory: dsh-plugin
      - run: npm run test:ci
